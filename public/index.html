      <h1>Adam Wilkinson</h1>
      <p>
        Software engineer and Computer Science student at the University of Southampton,
        currently a Software Engineering Intern at the Southampton Marine and Maritime
        Institute (SMMI). I build software that solves real-world problems — from Terrivia,
        a geography trivia game, to an AI-powered NYSE sentiment analyser.
      </p>
      <h2>Skills</h2>
      <p>Python, JavaScript, TypeScript, SQL, Java, Node.js, React, C, HTML/CSS, Kotlin, PostgreSQL.</p>
      <h2>Projects</h2>
      <ul>
        <li><a href="https://terrivia.com">Terrivia</a> — clue-based country identification on a live world map.</li>
        <li><a href="https://github.com/AdamWilkinson0/kotlinWallet">Kotlin Wallet</a> — Android tap-to-pay demo paid with blank NFC tags.</li>
        <li><a href="https://github.com/AdamWilkinson0/Stock-News-Sentiment-Analysis">NYSE Sentiment Analysis</a> — financial news sentiment vs. 14-day stock price trends.</li>
        <li><a href="https://countriviaa.netlify.app">Countrivia</a> — geography quiz with map and typing challenge modes.</li>
      </ul>
